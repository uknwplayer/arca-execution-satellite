name: ARCA Queued Public Executor Windows
run-name: ARCA Windows Queue ${{ github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - 'queue/windows/requests/*.json'

permissions:
  contents: read

concurrency:
  group: arca-public-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public satellite
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate satellite contract
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Resolve exactly one queued request
        id: request
        shell: pwsh
        run: |
          $files = @(git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA -- 'queue/windows/requests/*.json')
          if ($files.Count -ne 1) {
            Write-Error "Expected exactly one queued Windows request in the dispatch commit."
            exit 1
          }
          "path=$($files[0])" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Execute queued bounded profile
        shell: pwsh
        env:
          REQUEST_FILE: ${{ steps.request.outputs.path }}
          ARCA_EXECUTOR_ID: github-public-windows
        run: |
          python -m executor.queue --request-file "$env:REQUEST_FILE" --output execution-result.json

      - name: Hash result
        shell: pwsh
        run: |
          (Get-FileHash execution-result.json -Algorithm SHA256).Hash.ToLower()

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: arca-windows-executor-result-${{ github.run_id }}
          path: execution-result.json
          if-no-files-found: error
          retention-days: 7
